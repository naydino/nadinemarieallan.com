<svg width="100%" viewBox="0 0 680 620" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Baroque Karaoke system pipeline — input to visual performance</title>
<desc>Seven modular TouchDesigner containers carrying input through prompt construction, the API call, lyric parsing, and word timing to the final visual composite</desc>
<defs>
<marker id="bk-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>

<!-- VISITOR INPUT -->
<g>
  <rect x="265" y="20" width="150" height="56" rx="8" stroke-width="0.5" fill="rgb(68,68,65)" stroke="rgb(180,178,169)"/>
  <text x="340" y="41" text-anchor="middle" dominant-baseline="central" fill="rgb(211,209,199)" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500">Visitor input</text>
  <text x="340" y="59" text-anchor="middle" dominant-baseline="central" fill="rgb(180,178,169)" font-family="IBM Plex Mono, monospace" font-size="12">character · drama · sentence</text>
</g>
<line x1="340" y1="76" x2="340" y2="106" marker-end="url(#bk-arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

<!-- CONTAINER 1: INPUT HANDLING -->
<g>
  <rect x="265" y="106" width="150" height="56" rx="8" stroke-width="0.5" fill="rgb(60,52,137)" stroke="rgb(175,169,236)"/>
  <text x="340" y="127" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500">Input container</text>
  <text x="340" y="145" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="IBM Plex Mono, monospace" font-size="12">dropdown + sliders</text>
</g>
<line x1="340" y1="162" x2="340" y2="192" marker-end="url(#bk-arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

<!-- CONTAINER 2: PROMPT CONSTRUCTION -->
<g>
  <rect x="265" y="192" width="150" height="56" rx="8" stroke-width="0.5" fill="rgb(60,52,137)" stroke="rgb(175,169,236)"/>
  <text x="340" y="213" text-anchor="middle" dominant-baseline="central" fill="rgb(206,203,246)" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500">Prompt construction</text>
  <text x="340" y="231" text-anchor="middle" dominant-baseline="central" fill="rgb(175,169,236)" font-family="IBM Plex Mono, monospace" font-size="12">character voice + tone injection</text>
</g>
<line x1="340" y1="248" x2="340" y2="278" marker-end="url(#bk-arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

<!-- CONTAINER 3: API CALL -->
<g>
  <rect x="265" y="278" width="150" height="56" rx="8" stroke-width="0.5" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
  <text x="340" y="299" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500">API call</text>
  <text x="340" y="317" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="IBM Plex Mono, monospace" font-size="12">GPT-4o-mini · temperature</text>
</g>
<line x1="340" y1="334" x2="340" y2="364" marker-end="url(#bk-arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

<!-- CONTAINER 4: LYRIC PARSING -->
<g>
  <rect x="265" y="364" width="150" height="56" rx="8" stroke-width="0.5" fill="rgb(8,80,65)" stroke="rgb(93,202,165)"/>
  <text x="340" y="385" text-anchor="middle" dominant-baseline="central" fill="rgb(159,225,203)" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500">Lyric parsing</text>
  <text x="340" y="403" text-anchor="middle" dominant-baseline="central" fill="rgb(93,202,165)" font-family="IBM Plex Mono, monospace" font-size="12">response → word-level tokens</text>
</g>
<line x1="340" y1="420" x2="340" y2="450" marker-end="url(#bk-arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

<!-- CONTAINER 5: WORD TIMING -->
<g>
  <rect x="265" y="450" width="150" height="56" rx="8" stroke-width="0.5" fill="rgb(99,56,6)" stroke="rgb(239,159,39)"/>
  <text x="340" y="471" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500">Word timing</text>
  <text x="340" y="489" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="IBM Plex Mono, monospace" font-size="12">Tempo slider → pulse schedule</text>
</g>
<line x1="340" y1="506" x2="340" y2="536" marker-end="url(#bk-arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

<!-- CONTAINER 6: VISUAL COMPOSITE -->
<g>
  <rect x="265" y="536" width="150" height="56" rx="8" stroke-width="0.5" fill="rgb(113,43,19)" stroke="rgb(240,153,123)"/>
  <text x="340" y="557" text-anchor="middle" dominant-baseline="central" fill="rgb(245,196,179)" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500">Composite</text>
  <text x="340" y="575" text-anchor="middle" dominant-baseline="central" fill="rgb(240,153,123)" font-family="IBM Plex Mono, monospace" font-size="12">frame + portrait + neon text</text>
</g>

<!-- ERROR BRANCH -->
<g>
  <rect x="480" y="278" width="150" height="56" rx="8" stroke-width="0.5" fill="rgb(99,56,6)" stroke="rgb(239,159,39)"/>
  <text x="555" y="299" text-anchor="middle" dominant-baseline="central" fill="rgb(250,199,117)" font-family="IBM Plex Mono, monospace" font-size="14" font-weight="500">Missing API key</text>
  <text x="555" y="317" text-anchor="middle" dominant-baseline="central" fill="rgb(239,159,39)" font-family="IBM Plex Mono, monospace" font-size="12">portrait turns red, retry</text>
</g>
<line x1="415" y1="306" x2="480" y2="306" marker-end="url(#bk-arrow)" stroke="rgb(156,154,146)" stroke-width="1.5"/>

<!-- Layer labels -->
<text x="16" y="60" opacity="0.5" fill="rgb(194,192,182)" font-family="IBM Plex Mono, monospace" font-size="12">Input</text>
<text x="16" y="235" opacity="0.5" fill="rgb(194,192,182)" font-family="IBM Plex Mono, monospace" font-size="12">Generation</text>
<text x="16" y="480" opacity="0.5" fill="rgb(194,192,182)" font-family="IBM Plex Mono, monospace" font-size="12">Output</text>
</svg>
